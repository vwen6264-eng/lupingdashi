<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>录屏大师 · 提词器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f172a; color: #f8fafc; font: 14px system-ui, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px; background: #1e293b; }
    button { border: 1px solid #475569; border-radius: 6px; background: #334155; color: white; padding: 7px 10px; cursor: pointer; }
    button.primary { background: #6366f1; border-color: #6366f1; }
    label { display: flex; align-items: center; gap: 5px; }
    input { width: 82px; }
    #editor, #reader { width: 100%; flex: 1; min-height: 0; padding: 24px; border: 0; color: #f8fafc; background: #0f172a; font-family: inherit; line-height: 1.7; }
    #editor { resize: none; font-size: 20px; }
    #reader { overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .hint { margin: 0; padding: 8px 12px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
  <header>
    <button id="pinBtn" class="primary">置顶提词器</button>
    <button id="editBtn">编辑文稿</button>
    <button id="playBtn" class="primary">开始提词</button>
    <button id="resetBtn">回到开头</button>
    <label>速度 <input id="speed" type="range" min="5" max="150" value="35"><span id="speedValue">35</span></label>
    <label>字号 <input id="fontSize" type="range" min="18" max="72" value="32"><span id="fontSizeValue">32</span></label>
  </header>
  <p id="hint" class="hint">点击“置顶提词器”，录制时可继续调整；播放时按空格暂停或继续。</p>
  <textarea id="editor" placeholder="在这里输入或粘贴提词文稿…"></textarea>
  <div id="reader" class="hidden" tabindex="0"></div>
  </div>
  <script src="prompter.js"></script>
</body>
</html>
